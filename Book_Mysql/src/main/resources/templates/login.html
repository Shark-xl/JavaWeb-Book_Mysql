<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 精进图书商城</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-bg">
<main class="form-page">
    <section class="auth-box">
        <div class="auth-brand">
            <div class="auth-mark">📚</div>
            <h1 class="page-title">精进图书商城</h1>
            <p class="auth-subtitle">欢迎回来，继续你的阅读之旅</p>
        </div>
        <div class="alert" th:if="${message}" th:text="${message}"></div>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <form class="form-grid" th:action="@{/login}" method="post">
            <label class="field">
                <span>用户名</span>
                <input name="username" autocomplete="username" required>
            </label>
            <label class="field">
                <span>密码</span>
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button class="btn" type="submit">登录</button>
            <a class="btn ghost" th:href="@{/register}">创建账号</a>
        </form>
    </section>
</main>
</body>
</html>
