spring.application.name=Book_Mysql
server.port=8080

# MySQL 数据源配置：连接本机 book 数据库，供 MyBatis 执行 SQL 使用
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/book?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=自己输入自己的数据库密码

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# MyBatis 配置：指定 XML SQL 文件位置、实体类别名包、开启下划线到驼峰自动映射
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.book.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 管理员上传的商品图片保存目录
bookstore.upload-dir=uploads/books
