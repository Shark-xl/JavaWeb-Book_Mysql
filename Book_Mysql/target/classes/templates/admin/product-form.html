<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品表单 - 精进图书商城</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="logo">后台管理</div>
        <nav class="nav">
            <a th:href="@{/index}">返回商城</a>
            <a th:href="@{/admin}">商品管理</a>
            <a class="active" th:href="@{/admin/products/new}">商品表单</a>
        </nav>
        <a class="logout" th:href="@{/logout}">退出登录</a>
    </aside>
    <main class="main">
        <header class="topbar">商品维护</header>
        <section class="content">
            <h1 class="page-title" th:text="${product.id == null ? '新增商品' : '编辑商品'}">商品表单</h1>
            <form class="card form-grid"
                  th:action="@{${actionUrl}}"
                  th:object="${product}"
                  method="post"
                  enctype="multipart/form-data">
                <label class="field">
                    <span>商品名称</span>
                    <input th:field="*{name}" required>
                </label>
                <label class="field">
                    <span>价格</span>
                    <input th:field="*{price}" type="number" min="0" step="0.01" required>
                </label>
                <label class="field">
                    <span>库存</span>
                    <input th:field="*{stock}" type="number" min="0" required>
                </label>
                <label class="field">
                    <span>销量</span>
                    <input th:field="*{sales}" type="number" min="0">
                </label>
                <label class="field">
                    <span>分类</span>
                    <select th:field="*{categoryId}" required>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">分类</option>
                    </select>
                </label>
                <label class="field">
                    <span>图片路径</span>
                    <input th:field="*{imageUrl}" placeholder="/images/books/java.jpg">
                </label>
                <label class="field">
                    <span>上传本地图片</span>
                    <input name="uploadFile" type="file" accept="image/*">
                </label>
                <img data-image-preview class="book-cover" style="max-width:240px;" th:src="${product.imageUrl}" th:hidden="${product.imageUrl == null or #strings.isEmpty(product.imageUrl)}" alt="图片预览">
                <div class="row-actions">
                    <button class="btn" type="submit">保存</button>
                    <a class="btn ghost" th:href="@{/admin}">返回</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
